version: '3.8'

services:
  media-server:
    build: .
    image: media-server:latest
    container_name: media-server
    restart: unless-stopped
    ports:
      - "8080:80"          # access at http://nas-ip:8080
    volumes:
      # ── Source code (bind mount) ──────────────────────────────────────────────
      # git pull + docker-compose restart is enough for any code change.
      # Rebuild only needed when composer.json or Dockerfile changes.
      - .:/var/www/html

      # ── Vendor (named volume, populated from image) ───────────────────────────
      # Keeps composer-installed dependencies from the last build so the app
      # works without vendor/ being committed to git.
      - vendor:/var/www/html/vendor

      # ── Your media library ───────────────────────────────────────────────────
      # Mount your media share to /var/www/html/library inside the container.
      # Change the left side to wherever your library lives on the host.
      - /volume1/media/library:/var/www/html/library    # Synology shared folder
      # - /mnt/user/media:/var/www/html/library         # Unraid
      # - ./sample-library:/var/www/html/library        # local dev

      # ── Persistent data (DB + cache + cover art) ─────────────────────────────
      - ./data/storage:/var/www/html/storage
      - ./data/covers:/var/www/html/public/covers

volumes:
  vendor:
